name: migrate-flutter-3.47

on:
  push:
    branches:
      - flutter-3.47.2-getx-4.7.4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Apply GetX 4.7 compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          snackbar = Path('lib/get_navigation/src/snackbar/snackbar_controller.dart')
          text = snackbar.read_text()
          old = """    if (!withAnimations) {\n      _removeOverlay();\n      return;\n    }"""
          new = """    if (!withAnimations) {\n      _cancelTimer();\n      _removeOverlay();\n      return;\n    }"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Unexpected SnackbarController.close implementation')
          snackbar.write_text(text)

          transition = Path('lib/get_navigation/src/routes/get_transition_mixin.dart')
          text = transition.read_text()
          old = """        case Transition.cupertino:\n          return CupertinoPageTransition(\n            primaryRouteAnimation: animation,"""
          new = """        case Transition.cupertino:\n          return CupertinoPageTransition(\n            primaryRouteAnimation: linearTransition ? iosAnimation : animation,"""
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Unexpected Cupertino transition implementation')
          transition.write_text(text)

          Path('test/navigation/routes_test.dart').write_text("""import 'package:flutter/cupertino.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:get/get.dart';

          void main() {
            testWidgets('Back swipe dismiss interrupted by route push', (tester) async {
              await tester.pumpWidget(
                GetCupertinoApp(
                  popGesture: true,
                  defaultTransition: Transition.cupertino,
                  home: CupertinoPageScaffold(
                    child: Center(
                      child: CupertinoButton(
                        onPressed: () {
                          Get.to(() => const CupertinoPageScaffold(
                                child: Center(child: Text('route')),
                              ));
                        },
                        child: const Text('push'),
                      ),
                    ),
                  ),
                ),
              );

              await tester.tap(find.text('push'));
              await tester.pumpAndSettle();
              expect(find.text('route'), findsOneWidget);
              expect(find.text('push'), findsNothing);

              var gesture = await tester.startGesture(const Offset(5, 300));
              await gesture.moveBy(const Offset(400, 0));
              await tester.pump();

              final routeScaffold = find.ancestor(
                of: find.text('route'),
                matching: find.byType(CupertinoPageScaffold),
              );
              expect(tester.getTopLeft(routeScaffold).dx, moreOrLessEquals(400, epsilon: 1));
              expect(
                tester.state<NavigatorState>(find.byType(Navigator)).userGestureInProgress,
                true,
              );

              await gesture.up();
              await tester.pumpAndSettle();
              expect(find.text('push'), findsOneWidget);
              expect(find.text('route'), findsNothing);
              expect(
                tester.state<NavigatorState>(find.byType(Navigator)).userGestureInProgress,
                false,
              );

              await tester.tap(find.text('push'));
              await tester.pumpAndSettle();
              expect(find.text('route'), findsOneWidget);
              expect(find.text('push'), findsNothing);

              gesture = await tester.startGesture(const Offset(5, 300));
              await gesture.moveBy(const Offset(400, 0));
              await tester.pump();

              final dismissingRouteScaffold = find.ancestor(
                of: find.text('route'),
                matching: find.byType(CupertinoPageScaffold),
              );
              expect(
                tester.getTopLeft(dismissingRouteScaffold).dx,
                moreOrLessEquals(400, epsilon: 1),
              );
              expect(
                tester.state<NavigatorState>(find.byType(Navigator)).userGestureInProgress,
                true,
              );

              await gesture.up();
              await tester.pump(const Duration(milliseconds: 210));

              Get.to(() => const CupertinoPageScaffold(
                    child: Center(child: Text('route')),
                  ));

              await tester.pumpAndSettle();
              expect(find.text('route'), findsOneWidget);
              expect(find.text('push'), findsNothing);
              expect(
                tester.state<NavigatorState>(find.byType(Navigator)).userGestureInProgress,
                false,
              );
            });
          }
          """)
          PY

      - name: Apply Flutter design widgets migration
        run: dart fix --apply --code=migrate_design_widgets

      - name: Format migrated Dart sources
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only -- '*.dart')
          if [ ${#changed[@]} -gt 0 ]; then
            dart format "${changed[@]}"
          fi

      - name: Ensure legacy design imports are gone from Dart sources
        shell: bash
        run: |
          if grep -R -n -E "package:flutter/(material|cupertino)\.dart" lib test example --include='*.dart'; then
            echo 'Legacy material.dart/cupertino.dart imports still exist.'
            exit 1
          fi

      - name: Update changelog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          entry = """## [4.7.4]\n\n- Migrate Material and Cupertino APIs to the standalone `material_ui` and `cupertino_ui` packages for Flutter 3.47.2.\n- Raise the supported SDK baseline to Dart 3.13 and Flutter 3.47.2.\n- Fix Dart 3.13 compatibility in the GetX 4.7.3 codebase and legacy tests/examples.\n- Cancel Snackbar duration timers on immediate close and keep Cupertino back-swipe transitions linear during interactive gestures.\n\n"""
          if not text.startswith('## [4.7.4]'):
              path.write_text(entry + text)
          PY

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'devstecnologia'
          git config user.email '58450364+devstecnologia@users.noreply.github.com'
          git add lib test example pubspec.yaml pubspec.lock analysis_options.yaml CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
          else
            git commit -m 'Flutter 3.47.2: migrate GetX 4.7.3 to standalone design packages'
            git push
          fi
