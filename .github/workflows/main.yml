name: CI

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on:
      - self-hosted
      - devs-flutter-plugin-ci
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner dependencies
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xz-utils
          fi
          xz --version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
